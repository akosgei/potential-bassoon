spring:
  application:
    name: springboot-app
  
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/appdb
    username: appuser
    password: apppass123
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

server:
  port: 8090

# WireMock configuration
wiremock:
  url: http://localhost:8080

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.example.springbootapp: DEBUG
    org.hibernate.SQL: DEBUG
