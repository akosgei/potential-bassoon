version: '3.8'

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db
    environment:
      ORACLE_PASSWORD: oracle123
      ORACLE_DATABASE: appdb
      APP_USER: appuser
      APP_USER_PASSWORD: apppass123
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - spring-network

  wiremock:
    image: wiremock/wiremock:latest
    container_name: wiremock-server
    command:
      - --global-response-templating
      - --verbose
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
      - ./wiremock/files:/home/wiremock/__files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - spring-network

  springboot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springboot-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/appdb
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppass123
      WIREMOCK_URL: http://wiremock:8080
    ports:
      - "8090:8090"
    depends_on:
      oracle:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    networks:
      - spring-network

volumes:
  oracle-data:

networks:
  spring-network:
    driver: bridge
